[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zipaes"
version = "1.2.0"
description = "Auditoría, recuperación y extracción de archivos ZIP con cifrado AES (WinZip AE-1/AE-2), que la biblioteca estándar de Python no puede abrir."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "zipaes contributors" }]
keywords = [
    "zip", "aes", "winzip", "pkzip", "aes-256", "password-recovery",
    "hashcat", "john-the-ripper", "forense", "crypto",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Utilities",
]

dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6"]
# El generador neuronal del arnés de evaluación (no hace falta para usar el paquete).
eval = ["torch>=2.4", "transformers>=4.44"]

[project.scripts]
zipaes = "zipaes.cli:main"

[project.urls]
Homepage = "https://github.com/sudopimp/zipaes"
Documentacion = "https://github.com/sudopimp/zipaes/tree/main/docs"
Issues = "https://github.com/sudopimp/zipaes/issues"
Changelog = "https://github.com/sudopimp/zipaes/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["zipaes"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
norecursedirs = [".venv", "build", "dist", ".git"]

[tool.coverage.run]
source = ["zipaes"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]